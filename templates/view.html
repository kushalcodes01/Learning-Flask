<!DOCTYPE html>
<html>
    <head>
        <title>View Students</title>
    </head>
    <body>
        {% include 'navbar.html' %}
        
        <h1>All Students</h1>
        <table border="1">

        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Semester</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
        </tr>

        {% endfor %}

        </table>
    
    </body>
</html>
